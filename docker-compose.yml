version: '3.8'

services:
  bet-engine:
    build: .
    ports:
      - "50051:50051"
      - "6060:6060"
    restart: always

  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
